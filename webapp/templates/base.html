<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Etsy Copilot{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⌬</span>
      <span class="brand-name">Etsy Copilot</span>
    </div>
    {% if status %}
    <nav class="steps">
      <span class="step {% if status.anthropic_key %}done{% endif %}">1. Claude</span>
      <span class="step {% if status.etsy_credentials %}done{% endif %}">2. Etsy app</span>
      <span class="step {% if status.etsy_oauth %}done{% endif %}">3. Authorize</span>
      <span class="step {% if status.browser_cookies %}done{% endif %}">4. Cookies</span>
    </nav>
    {% endif %}
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>Self-hosted · all data stays on your machine</span>
    <span class="muted">localhost</span>
  </footer>
</body>
</html>
